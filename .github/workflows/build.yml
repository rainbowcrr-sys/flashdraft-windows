name: windows-build

on:
  push:
    branches: [ main ]
    tags: [ 'v0.*' ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build FlashDraft.Windows.sln -c Release
      - name: Publish
        run: dotnet publish src/FlashDraft.Desktop/FlashDraft.Desktop.csproj -c Release -r win-x64 --self-contained true -o ./publish
      # Adjustable: add WiX msi packaging here when tooling is available. The
      # payload stays unsigned at zero cost and is shipped with a SHA-256 sum.
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path ./publish/* -DestinationPath ./FlashDraft-Windows-x64.zip
      - name: Checksum
        shell: pwsh
        run: (Get-FileHash ./FlashDraft-Windows-x64.zip -Algorithm SHA256).Hash | Out-File ./SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: flashdraft-windows
          path: |
            ./FlashDraft-Windows-x64.zip
            ./SHA256SUMS.txt
