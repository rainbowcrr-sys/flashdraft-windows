name: windows-build

on:
  push:
    branches: [ main ]
    tags: [ 'v0.*' ]
  pull_request:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel for manual runs'
        required: false
        default: 'edge'
        type: choice
        options:
          - edge
          - nightly

permissions:
  contents: write

jobs:
  precheck:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          # Only the scheduled nightly is skipped. Every other event builds.
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SHA="${{ github.sha }}"
          BODY="$(gh release view nightly --json body --jq '.body' 2>/dev/null || true)"
          if [[ "$BODY" == *"Build-SHA: $SHA"* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Nightly already built for $SHA; skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: precheck
    if: needs.precheck.outputs.skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Fetch canonical license
        shell: pwsh
        run: |
          try {
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/rainbowcrr-sys/flashdraft-core/main/LICENSE" -OutFile "packaging/LICENSE.txt" -UseBasicParsing -ErrorAction Stop
          } catch {
            Copy-Item LICENSE packaging/LICENSE.txt -Force
          }
      - name: Build
        run: dotnet build FlashDraft.Windows.sln -c Release
      - name: Publish self-contained payload
        run: dotnet publish src/FlashDraft.Desktop/FlashDraft.Desktop.csproj -c Release -r win-x64 --self-contained true -o ./publish
      - name: Include license in the payload
        shell: pwsh
        run: Copy-Item packaging/LICENSE.txt publish/LICENSE.txt -Force
      - name: Build installable setup executable with a license page
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress --limit-output }
          if (-not (Test-Path $iscc)) { Write-Error "Inno Setup 6 is unavailable"; exit 1 }
          & $iscc packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { Write-Error "ISCC failed with $LASTEXITCODE"; exit $LASTEXITCODE }
          if (-not (Test-Path ./FlashDraft-Windows-x64-Setup.exe)) { Write-Error "Setup.exe missing"; exit 1 }
      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path ./publish/* -DestinationPath ./FlashDraft-Windows-x64-Portable.zip
      - name: Checksum
        shell: pwsh
        run: |
          $files = @("./FlashDraft-Windows-x64-Setup.exe", "./packaging/FlashDraft-Windows-x64-Setup.exe", "./FlashDraft-Windows-x64-Portable.zip") | Where-Object { Test-Path $_ }
          $lines = foreach ($f in $files) { $h = (Get-FileHash $f -Algorithm SHA256).Hash; "$h  $(Split-Path $f -Leaf)" }
          $lines | Out-File -Encoding utf8 ./SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: flashdraft-windows
          if-no-files-found: error
          path: |
            ./FlashDraft-Windows-x64-Setup.exe
            ./packaging/FlashDraft-Windows-x64-Setup.exe
            ./FlashDraft-Windows-x64-Portable.zip
            ./SHA256SUMS.txt
  release:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: flashdraft-*
          path: dist
          merge-multiple: true
      - name: Publish build artifacts to a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set +e
          set +o pipefail
          {
          set -eu
          mapfile -t FILES < <(find dist -type f -print)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::No build artifacts were downloaded"
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            TITLE="FlashDraft ${TAG}"
            NOTES="Stable release ${TAG}. All packages are unsigned; verify SHA256SUMS before use."
            PRERELEASE=0
          elif [[ "${GITHUB_EVENT_NAME}" == "schedule" || "${{ inputs.channel }}" == "nightly" ]]; then
            TAG="nightly"
            TITLE="Nightly build $(date -u +%F)"
            NOTES="Automated nightly build. Unsigned and unverified; use at your own risk."
            PRERELEASE=1
          else
            TAG="edge"
            TITLE="Edge build"
            NOTES="Rolling build from the main branch. Unsigned and unverified."
            PRERELEASE=1
          fi
          NOTES="${NOTES} | Build-SHA: ${GITHUB_SHA}"
          ARGS=()
          if [[ "$PRERELEASE" == "1" ]]; then ARGS+=(--prerelease); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Remove stale assets so nightly/edge releases never accumulate old files.
            gh release view "$TAG" --json assets --jq '.assets[].name' | while IFS= read -r name; do
              gh release delete-asset "$TAG" "$name" --yes >/dev/null 2>&1 || true
            done
            gh release upload "$TAG" "${FILES[@]}" --clobber
            gh release edit "$TAG" --notes "$NOTES" || true
          else
            gh release create "$TAG" "${ARGS[@]}" --title "$TITLE" --notes "$NOTES" "${FILES[@]}"
          fi
          echo "Published ${#FILES[@]} file(s) to release $TAG"
          } > release.log 2>&1
          status=$?
          cat release.log
          if [ "$status" -ne 0 ]; then
            tail -30 release.log | while IFS= read -r line; do echo "::error::$line"; done
            exit "$status"
          fi
